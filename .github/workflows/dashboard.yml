name: Dashboard

on:
  schedule:
    - cron: "0 4 * * *"   # codziennie ok. 5-6 rano czasu polskiego
  workflow_dispatch:       # przycisk "Run workflow" do ręcznego odświeżenia
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz dane i zbuduj dashboard
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: python3 sezon.py

      - name: Zaszyfruj hasłem
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          pip install --quiet cryptography==43.0.3
          python3 szyfruj.py dashboard.html public/index.html
          printf "User-agent: *\nDisallow: /\n" > public/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
